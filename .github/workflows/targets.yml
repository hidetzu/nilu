name: targets

# Each release target on a runner of its own (hidetzu/nilu#8): what builds,
# links, runs and passes there, step by step. A cross build is not evidence
# that a target runs, so every step below runs on the target itself. Steps go
# on after a failure, so one run says which of them fails on each target.
on:
  pull_request:
    paths: [.github/workflows/targets.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-macos, runner: macos-15-intel }
          - { target: aarch64-macos, runner: macos-latest }
          - { target: x86_64-windows-gnu, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: zig version && zig env
        shell: bash
      - run: node --version; cc --version || echo "no cc"
        shell: bash
        continue-on-error: true
      - name: test
        run: zig build test --summary all
        continue-on-error: true
      - name: c-test
        run: zig build c-test --summary all
        continue-on-error: true
      - name: cli-test
        run: zig build cli-test --summary all
        continue-on-error: true
      - name: example
        run: zig build example --summary all
        continue-on-error: true
      - name: manual-check
        run: zig build manual-check --summary all
        continue-on-error: true
      - name: check
        run: zig build check --summary all
        continue-on-error: true
      - name: dist
        run: zig build dist --summary all
        continue-on-error: true
