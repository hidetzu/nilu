name: targets

# Each release target on a runner of its own (hidetzu/nilu#8): what builds,
# links, runs and passes there, step by step. A cross build is not evidence
# that a target runs, so every step below runs on the target itself. Steps go
# on after a failure, so one run says which of them fails on each target.
on:
  pull_request:
    paths: [.github/workflows/targets.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-macos, runner: macos-15-intel }
          - { target: aarch64-macos, runner: macos-latest }
          - { target: x86_64-windows-gnu, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: zig version && zig env
        shell: bash
      - run: node --version; cc --version || echo "no cc"
        shell: bash
        continue-on-error: true
      - name: stack limit
        run: ulimit -s || true
        shell: bash
        continue-on-error: true
      - name: one test that stopped the run
        run: zig build test -Dtest-filter="a protected inner failure is invisible" --summary all
        continue-on-error: true
      - name: the same with a 64 MiB stack
        run: ulimit -s 65520 && zig build test -Dtest-filter="a protected inner failure is invisible" --summary all
        shell: bash
        if: runner.os != 'Windows'
        continue-on-error: true
      - name: test
        run: zig build test --summary all
        continue-on-error: true
      - name: the test binary run directly
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          bin=$(ls -t .zig-cache/o/*/test | head -1)
          set +e
          "$bin" > direct.out 2> direct.err
          echo "exit status $?"
          grep -n -B2 -A25 -E "FAIL|failed with" direct.err | head -120
          echo "--- stdout tail"
          tail -c 1000 direct.out
          echo "--- stderr bytes $(wc -c < direct.err)"
      - name: failure_handling tests alone
        if: runner.os != 'Windows'
        run: zig build test -Dtest-filter=failure_handling --summary all
        continue-on-error: true
      - name: the command run by hand
        shell: bash
        continue-on-error: true
        run: |
          zig build --summary none
          ls zig-out/bin
          for exe in zig-out/bin/nilu zig-out/bin/nilu.exe; do [ -e "$exe" ] || continue
            "$exe" -v | od -c | head -3; echo "exit ${PIPESTATUS[0]}"
            "$exe" -e 'print(1 + 1)' | od -c | head -3; echo "exit ${PIPESTATUS[0]}"
          done
      - name: c-test
        run: zig build c-test --summary all 2>&1 | grep -v "^  ok " | tail -60
        shell: bash
        continue-on-error: true
      - name: cli-test
        run: zig build cli-test --summary all
        continue-on-error: true
      - name: example
        run: zig build example --summary all 2>&1 | tail -60
        shell: bash
        continue-on-error: true
      - name: manual-check
        run: zig build manual-check --summary all
        continue-on-error: true
      - name: check
        run: zig build check --summary all
        continue-on-error: true
      - name: dist
        run: zig build dist --summary all
        continue-on-error: true
